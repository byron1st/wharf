# wharf config example.
# Default location: <os.UserConfigDir()>/wharf/config.toml
#   (macOS: ~/Library/Application Support/wharf/config.toml, Linux: ~/.config/wharf/config.toml)
# Override the location with the WHARF_CONFIG environment variable.
# Every key is optional and a missing file means all defaults. Unknown keys are rejected.
# The atlassian_* keys go together: set all three or none. Saving Settings › Atlassian Cloud
# in the web app rewrites only those three lines, keeping comments and other keys.

# TCP address the server listens on. Default: "127.0.0.1:8080" (this machine only)
# Requests must come from this machine and name a loopback host (localhost, 127.0.0.1,
# [::1]); others get 403, so listening on other interfaces does not open the API to them.
# addr = "127.0.0.1:8080"

# Postgres (Supabase) connection URL, postgres:// or postgresql://, WITHOUT a password.
# Tables live in the wharf schema, which wharf creates when missing.
# The password is read at startup from the macOS login keychain, from the generic password
# item whose service is "wharf-db". Add it once (the -w flag with no value prompts for it):
#   security add-generic-password -a "$USER" -s wharf-db -w
# With Supabase, use the Session pooler URL (port 5432) from Connect › Session pooler;
# the Transaction pooler (port 6543) does not keep the session wharf relies on.
# Required to start the server; Load accepts a file without it so Settings can still be saved.
# db_url = "postgresql://postgres.<project-ref>@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require"

# Jira Cloud REST API base URL (https only, no query or fragment).
# Either your site URL, or for a scoped API token the gateway URL
# https://api.atlassian.com/ex/jira/{cloudId}
# The URL path is kept, so the gateway prefix is preserved.
atlassian_site_url = "https://your-site.atlassian.net"

# Atlassian account email for Basic auth.
atlassian_email = "you@example.com"

# Atlassian API token for Basic auth. Create one at
# https://id.atlassian.com/manage-profile/security/api-tokens. Stored in plain text,
# so keep this file readable only by you (chmod 600).
atlassian_api_token = "your-api-token"

# Check GitHub Releases for a newer wharf and offer it in the web app (and as a macOS
# notification). Only release builds on macOS (arm64) check. Default: true
# update_check = true

# How often to check, as a duration such as "6h" or "48h"; at least "1h". Default: "24h"
# update_check_interval = "24h"
